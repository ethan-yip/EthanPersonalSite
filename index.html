    <script>
      // Enable scroll-reveal animations only when JS is present; without JS, content stays visible.
      document.documentElement.classList.add('js-anim');
      // Failsafe: once loaded, reveal anything already on screen so above-the-fold content never waits on the observer.
      addEventListener('load', function () {
        requestAnimationFrame(function () {
          var limit = window.innerHeight * 1.15;
          document.querySelectorAll('.reveal:not(.visible)').forEach(function (el) {
            if (el.getBoundingClientRect().top < limit) el.classList.add('visible');
          });
        });
      });
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
